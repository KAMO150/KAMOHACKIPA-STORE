<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAMOHACK STORE</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="background">
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>
</div>

<header class="header">

    <div class="logo">
        <img <img src="logo.png.PNG" alt="KAMOHACK STORE">
        <div>
            <h1>KAMOHACK STORE</h1>
            <p>Premium IPA Store</p>
        </div>
    </div>

    <nav>
        <a href="#">الرئيسية</a>
        <a href="#">التطبيقات</a>
        <a href="#">الألعاب</a>
        <a href="#">تواصل</a>
    </nav>

</header>

<section class="hero">

    <h2>أفضل متجر IPA للأيفون</h2>

    <p>
        حمل أحدث التطبيقات والألعاب المعدلة
        بتصميم احترافي وسرعة عالية.
    </p>

    <div class="search">

        <input
        type="text"
        placeholder="ابحث عن تطبيق...">

        <button>
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>

    </div>

</section>

<section class="apps">

    <div class="card">
        <img src="https://cdn-icons-png.flaticon.com/512/174/174872.png">
        <h3>Spotify Premium</h3>
        <p>آخر إصدار</p>
        <button>Download</button>
    </div>

    <div class="card">
        <img src="https://cdn-icons-png.flaticon.com/512/732/732212.png">
        <h3>YouTube Premium</h3>
        <p>آخر إصدار</p>
        <button>Download</button>
    </div>

    <div class="card">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968520.png">
        <h3>Instagram</h3>
        <p>Modified IPA</p>
        <button>Download</button>
    </div>

    <div class="card">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968841.png">
        <h3>TikTok</h3>
        <p>Premium IPA</p>
        <button>Download</button>
    </div>

</section>

<footer>

    © 2026 KAMOHACK STORE

</footer>

<script src="script.js"></script>

</body>
</html>
